version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app?schema=public
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
    entrypoint: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed && node dist/main"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  db_data:
